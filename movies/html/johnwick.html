        <h2>剧情简介</h2>
        <p class="intro">约翰·威克曾是江湖上令人闻风丧胆的顶尖杀手，为爱金盆洗手。妻子病逝后，俄罗斯黑帮头目的儿子闯入他家，偷走了他亡妻留下的爱车，还杀死了妻子留给他的小狗。退隐的传奇杀手重拾枪械，单枪匹马杀回地下世界，一场雷霆万钧的复仇就此展开。</p>
