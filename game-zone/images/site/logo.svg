<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="游戏天地 logo">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3f6b"/>
      <stop offset="0.55" stop-color="#22253c"/>
      <stop offset="1" stop-color="#141626"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9a227"/>
      <stop offset="1" stop-color="#7c5bd0"/>
