  <rect x="53" y="17" width="26" height="26" rx="6" fill="#f5f3ef" opacity="0.3"/>
  <rect x="17" y="53" width="26" height="26" rx="6" fill="#f5f3ef" opacity="0.3"/>
  <rect x="53" y="53" width="26" height="26" rx="6" fill="url(#g2)" opacity="0.6"/>
  <!-- 中间十字准星，呼应「游戏」与「研究」 -->
  <path d="M48 10v9M48 77v9M10 48h9M77 48h9" stroke="#f5f3ef" stroke-width="2.6" stroke-linecap="round" opacity="0.75"/>
