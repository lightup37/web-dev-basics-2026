<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="一页简洁的个人介绍。">
  <meta name="theme-color" content="#ffffff">
  <title>周运浩</title>
  <style>
    :root {
      color-scheme: light;
      --page: #ffffff;
      --ink: #111518;
      --muted: #53616a;
      --blue: #2f6488;
      --blue-deep: #183e59;
      --glass: rgba(245, 248, 250, .66);
      --glass-line: rgba(255, 255, 255, .92);
      --edge-shade: rgba(51, 74, 88, .18);
      --reading-font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", sans-serif;
      --title-font: "STKaiti", "KaiTi", "楷体", "Kaiti SC", serif;
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; background: var(--page); }

    body {
      min-height: 100svh;
      margin: 0;
      color: var(--ink);
      background: var(--page);
      font-family: var(--reading-font);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .page {
      position: relative;
      isolation: isolate;
      display: grid;
      min-height: 100svh;
      place-items: center;
      overflow: hidden;
      padding: clamp(24px, 5vw, 72px);
    }

    /* 两块低饱和实体色藏在玻璃后方，只用来显出透明度与折射。 */
    .page::before,
    .page::after {
      content: "";
      position: absolute;
      z-index: -2;
      border-radius: 999px;
      pointer-events: none;
    }

    .page::before {
      width: min(58vw, 720px);
      height: min(35vw, 410px);
      left: -13vw;
      top: 7vh;
      background: #edf0f2;
      transform: rotate(-11deg);
    }

    .page::after {
      width: min(47vw, 570px);
      height: min(29vw, 350px);
      right: -11vw;
      bottom: 5vh;
      background: #e7f0f5;
      transform: rotate(13deg);
    }

    .profile-card {
      --rx: 0deg;
      --ry: 0deg;
      --light-x: 50%;
      --light-y: 18%;
      position: relative;
      display: grid;
      grid-template-columns: minmax(260px, .88fr) minmax(340px, 1.12fr);
      width: min(1060px, 100%);
      min-height: 570px;
      overflow: hidden;
      border: 1px solid var(--glass-line);
      border-radius: 24px;
      background: var(--glass);
      box-shadow:
        0 34px 90px rgba(42, 59, 69, .16),
        0 7px 24px rgba(42, 59, 69, .09),
        inset 1px 1px 0 rgba(255, 255, 255, .98),
        inset -1px -1px 0 var(--edge-shade);
      -webkit-backdrop-filter: blur(26px) saturate(1.18) contrast(1.035);
      backdrop-filter: blur(26px) saturate(1.18) contrast(1.035);
      transform: perspective(1400px) rotateX(var(--rx)) rotateY(var(--ry));
      transform-style: preserve-3d;
      transition: transform .72s cubic-bezier(.2, .75, .2, 1), box-shadow .72s ease;
      animation: card-in 1.05s cubic-bezier(.18, .78, .22, 1) both;
    }

    /* 光泽仅出现在玻璃边缘，中心保持安静、通透。 */
    .profile-card::before {
      content: "";
      position: absolute;
      z-index: 3;
      inset: 0;
      padding: 1.5px;
      border-radius: inherit;
      background:
        radial-gradient(circle at var(--light-x) var(--light-y), rgba(255, 255, 255, .98), transparent 23%),
        linear-gradient(138deg, rgba(255, 255, 255, .88), rgba(255, 255, 255, .09) 42%, rgba(30, 74, 101, .28));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* 极细噪点模拟磨砂颗粒；透明度很低，不干扰正文。 */
    .profile-card::after {
      content: "";
      position: absolute;
      z-index: 2;
      inset: 0;
      opacity: .105;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.34'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
      pointer-events: none;
    }

    .portrait-panel,
    .copy-panel {
      position: relative;
      z-index: 1;
      min-width: 0;
    }

    .portrait-panel {
      display: grid;
      place-items: center;
      padding: clamp(34px, 5vw, 64px);
      border-right: 1px solid rgba(55, 76, 88, .13);
      background: rgba(225, 231, 234, .48);
    }

    .portrait-panel::after {
      content: "";
      position: absolute;
      top: 10%;
      right: -1px;
      width: 3px;
      height: 36%;
      border-radius: 999px;
      background: rgba(47, 100, 136, .72);
      box-shadow: -3px 0 10px rgba(255, 255, 255, .95), 3px 0 13px rgba(34, 76, 103, .22);
    }

    .portrait-wrap {
      display: grid;
      width: min(100%, 320px);
      margin: 0;
      place-items: center;
      transform: translateZ(34px);
    }

    .portrait-lens {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border: 1px solid rgba(255, 255, 255, .95);
      border-radius: 50%;
      background: rgba(255, 255, 255, .2);
      box-shadow:
        0 28px 55px rgba(35, 75, 100, .16),
        inset 0 0 0 7px rgba(255, 255, 255, .23),
        inset 5px 5px 14px rgba(255, 255, 255, .9),
        inset -7px -8px 16px rgba(40, 89, 121, .2);
      transition: transform .74s cubic-bezier(.16, .82, .2, 1), box-shadow .74s ease;
    }

    .portrait-lens::before {
      content: "";
      position: absolute;
      z-index: 1;
      inset: 4.5%;
      border: 1px solid rgba(255, 255, 255, .78);
      border-radius: inherit;
      box-shadow: inset 8px 8px 17px rgba(255, 255, 255, .76), inset -7px -8px 14px rgba(35, 83, 114, .18);
      pointer-events: none;
    }

    .portrait-lens img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .copy-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(44px, 6vw, 82px);
      transform: translateZ(22px);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 18px;
      color: var(--blue-deep);
      font-size: .82rem;
      font-weight: 780;
      letter-spacing: .22em;
    }

    .eyebrow::before {
      content: "";
      width: 34px;
      height: 3px;
      border-radius: 99px;
      background: var(--blue);
      box-shadow: 0 0 10px rgba(47, 100, 136, .18);
    }

    h1 {
      margin: 0;
      color: #080b0d;
      font-family: var(--title-font);
      font-size: clamp(3rem, 7vw, 5.5rem);
      font-weight: 900;
      letter-spacing: -.06em;
      line-height: 1;
    }

    .rule {
      width: 100%;
      height: 0;
      margin: 28px 0;
      border: 0;
      border-top: 1px solid rgba(33, 59, 75, .38);
      box-shadow: 0 1px 0 rgba(255, 255, 255, .88);
    }

    .introduction {
      max-width: 39rem;
      margin: 0;
      color: #27343c;
      font-size: clamp(1rem, 1.5vw, 1.12rem);
      font-weight: 520;
      letter-spacing: .025em;
      line-height: 2;
      text-align: justify;
      text-justify: inter-ideograph;
    }

    @keyframes card-in {
      from { opacity: 0; transform: perspective(1400px) translateY(28px) scale(.975); }
      to { opacity: 1; transform: perspective(1400px) translateY(0) scale(1) rotateX(var(--rx)) rotateY(var(--ry)); }
    }

    @media (hover: hover) and (pointer: fine) {
      .profile-card:hover {
        box-shadow:
          0 39px 105px rgba(42, 59, 69, .19),
          0 9px 30px rgba(42, 59, 69, .1),
          inset 1px 1px 0 rgba(255, 255, 255, .98),
          inset -1px -1px 0 var(--edge-shade);
      }

      .profile-card:hover .portrait-lens {
        transform: scale(1.025);
        box-shadow:
          0 32px 68px rgba(35, 75, 100, .2),
          inset 0 0 0 7px rgba(255, 255, 255, .25),
          inset 5px 5px 14px rgba(255, 255, 255, .94),
          inset -7px -8px 16px rgba(40, 89, 121, .23);
      }
    }

    @media (max-width: 760px) {
      .page {
        overflow: visible;
        padding: 18px;
      }

      .page::before {
        width: 88vw;
        height: 42vh;
        left: -36vw;
      }

      .page::after {
        width: 82vw;
        height: 38vh;
        right: -32vw;
      }

      .profile-card {
        grid-template-columns: 1fr;
        min-height: 0;
        border-radius: 20px;
      }

      .portrait-panel {
        padding: 34px 30px 30px;
        border-right: 0;
        border-bottom: 1px solid rgba(55, 76, 88, .13);
      }

      .portrait-panel::after {
        top: auto;
        right: 11%;
        bottom: -1px;
        width: 36%;
        height: 3px;
      }

      .portrait-wrap {
        width: min(64vw, 260px);
      }

      .copy-panel {
        padding: 38px 30px 44px;
      }

      h1 {
        font-size: clamp(3rem, 17vw, 4.6rem);
      }

      .introduction {
        font-size: 1rem;
        line-height: 1.95;
        text-align: left;
      }
    }

    @media (max-width: 390px) {
      .page { padding: 10px; }
      .copy-panel { padding-inline: 24px; }
      .portrait-wrap { width: min(70vw, 230px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    @media print {
      .page { min-height: auto; overflow: visible; padding: 0; }
      .page::before, .page::after, .profile-card::after { display: none; }
      .profile-card { box-shadow: none; background: #fff; transform: none !important; }
    }
  </style>
</head>

      <section class="copy-panel">
        <p class="eyebrow">GAME CREATOR PROFILE</p>
        <h1 id="profile-title">周运浩        </h1>
        <hr class="rule">
        <p class="introduction">主要负责游戏的 UI 设计、美术制作与文档编辑，关注视觉风格、信息层级与交互反馈的统一。设计过程中重视玩家的感受，兼顾长时间游玩的清晰、顺畅与舒适；从界面布局、色彩搭配、图形细节，到说明文档的结构与措辞，都会反复推敲和调整。擅长把零散想法整理成可执行的方案，通过修改让画面与文字准确服务游戏体验。对新工具与表达方式保持好奇，在实践中学习、验证和改进。创作目标并非堆叠元素，而是让每一个界面、图像和句子都拥有明确作用，共同构成完整、自然且具有辨识度的作品。</p>
      </section>
    </article>
  </main>

  <script>
    (() => {
      const card = document.querySelector(".profile-card");
      const finePointer = matchMedia("(hover: hover) and (pointer: fine)");
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
      let frame = 0;

      function resetCard() {
        cancelAnimationFrame(frame);
        card.style.setProperty("--rx", "0deg");
        card.style.setProperty("--ry", "0deg");
        card.style.setProperty("--light-x", "50%");
        card.style.setProperty("--light-y", "18%");
      }

      card.addEventListener("pointermove", (event) => {
        if (!finePointer.matches || reducedMotion.matches) return;
        const rect = card.getBoundingClientRect();
        const x = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
        const y = Math.min(1, Math.max(0, (event.clientY - rect.top) / rect.height));
        cancelAnimationFrame(frame);
        frame = requestAnimationFrame(() => {
          card.style.setProperty("--rx", `${((.5 - y) * 2.2).toFixed(2)}deg`);
          card.style.setProperty("--ry", `${((x - .5) * 2.6).toFixed(2)}deg`);
          card.style.setProperty("--light-x", `${(x * 100).toFixed(1)}%`);
          card.style.setProperty("--light-y", `${(y * 100).toFixed(1)}%`);
        });
      });

      card.addEventListener("pointerleave", resetCard);
      finePointer.addEventListener?.("change", resetCard);
      reducedMotion.addEventListener?.("change", resetCard);
    })();
  </script>
