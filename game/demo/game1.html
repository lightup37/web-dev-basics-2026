<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" href="css/style.css">
	<title>Game - Level#1</title>
	<link rel="icon" type="image/svg+xml" href="./favicon.svg">
	<!--把js文件放在头部，方便查阅-->
    <script src="js/constants.js" defer></script>
    <script src="js/pieces.js" defer></script>
    <script src="js/arrow.js" defer></script>
    <script src="js/dialog.js" defer></script>
    <script src="js/account.js" defer></script>
    <script src="js/save.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/ai.js" defer></script>
    <script src="js/levels.js" defer></script>
    <script src="js/game1.js" defer></script>
</head>
<body class="game1">
	<audio id="game-music" loop>
	<source src="mus/easygame.mp3" type="audio/mpeg">
</audio>
<div style="display: flex; flex-direction: column; align-items: center; padding: 0%;">
	<!--游戏上方标题-->
	<h2>Game1 : Break through the defense</h2>
	<footer><p id="footer-bar" style="font-size: x-small; margin: 0px 0px 10px;"></p></footer>
</div>
<div id="info-bar"></div>
<div id="enemy-info"></div>
<div id="board"></div>
<div id="win" style="display: none;">
	<!--结算弹窗-->
	<h1>You Win!</h1>
	<h2 id="3star" style="display: none;">⭐⭐⭐</h2>
	<h2 id="2star" style="display: none;">⭐⭐</h2>
	<h2 id="1star" style="display: none;">⭐</h2>
</div>
<div id="lose" style="display: none;">
	<h1>You Lose!</h1>
	<p id="loseTips" style="font-size: x-small;"></p>
</div>
	<!--底部按钮-->
<button id="button" style="width: 100px; height: 50px;"> Next Turn </button>
<button id="button-next-game" style="display: none;"> Next Game </button>
<button id="button-replay" style="display: none;"> Replay </button>
<button id="button-fail" style="display: none;"> View Ending: Early Defeat </button>
<div id="game-actions">
	<span id="save-load-btns">
		<button id="button-save" class="game-btn" title="把当前这关的中途状态存进所选手动存档槽"> Save </button>
		<select id="slot-select"></select>
		<button id="button-load" class="game-btn" title="读取所选手动存档槽的中途状态（覆盖当前进度）"> Load </button>
		<button id="button-mode" class="game-btn" title="切换为查看敌方剩余血量，再按一次返回指挥"> 查看敌人 </button>
	</span>
	<button id="button-exit" class="game-btn" title="返回游戏主界面"> Menu </button>
</div>
<script>
	// 第一关背景音乐
	var gameMusic = document.getElementById('game-music');
	gameMusic.volume = 0.35;

	if (sessionStorage.getItem('game1Music') === '1') {
		sessionStorage.removeItem('game1Music');

		gameMusic.play().catch(function () {
			// 如果浏览器阻止自动播放，
			// 第一次点击页面时开始播放
			document.addEventListener('click', function () {
				gameMusic.play();
			}, { once: true });
		});
	}
</script>
</body>

</html>
