<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>结局：通往滑铁卢 - 拿破仑战争</title>
	<link rel="stylesheet" href="css/style.css?v=20260917-tutor1">
	<link rel="icon" type="image/svg+xml" href="./favicon.svg">
</head>
<body class="page-ending ending-victory" data-title-i18n="ending.standardTitle">
	<audio id="game-music" loop>
		<source src="mus/La-Marseillaise.mp3" type="audio/mpeg">
	</audio>


	<div class="page-box">
		<p class="page-kicker" data-localize>CAMPAIGN CONCLUDED · 战役终章</p>
		<h1 data-i18n="ending.standardTitle">结局 · 通往滑铁卢</h1>
		<p class="page-sub" data-i18n="ending.standardSub">利尼获胜，却未能摧毁普军</p>
		<div class="story-panel">
			<p class="story-line" data-i18n="ending.standard1">古尔戈：内伊没能夺下四臂村；威灵顿得知普军在利尼失利后，向蒙圣让高地撤退。</p>
			<p class="story-line" data-i18n="ending.standard2">拿破仑：命格鲁希紧追普军。只要他们不能与威灵顿会合，我们仍能各个击破。</p>
			<p class="story-line" data-i18n="ending.standard3">传令兵：普军没有向东溃散，而是保持建制向北退往瓦夫尔。</p>
			<p class="story-line" data-i18n="ending.standard4">拿破仑：那就让全军休整。明早必须在两支联军重新握手之前，击穿蒙圣让。</p>
			<p class="story-line" data-i18n="ending.standard5">战地旁白：1815年6月18日，湿地拖慢法军进攻，普军赶到滑铁卢，近卫军最终被击退。拿破仑四天后再度退位。</p>
		</div>
		<p class="page-note" data-i18n="ending.standardNote" id="normal-note">（正常结局：故事回到正史。另一种可能仍藏在战役地图的秘密路线中……）</p>
		<div class="form-box">
			<button id="button-next" class="game-btn" data-localize>Next</button>
		</div>
	</div>
	<script src="js/account.js?v=20260917-tutor1"></script>
	<script src="js/ui.js?v=20260917-tutor1"></script>
	<script src="js/save.js?v=20260917-tutor1"></script>
	<script>
		if (typeof currentUser === 'function' && currentUser()) unlockAchievement('victory_end');

		/* 2026-09：隐藏路线已经打开时，这句"另一种可能，还藏在更深处"的暗示就不成立了
		   （地图上已经能看见隐藏关），直接不显示。 */
		if (typeof hiddenRouteOpen === 'function' && hiddenRouteOpen()) {
			var _note = document.getElementById('normal-note');
			if (_note) _note.style.display = 'none';
		}

		/* 2026-09：结局页只留一个出口 —— Next 回主界面。
		   原先的"改写历史 · 进入隐藏关"入口已移除：隐藏关现在从主界面战役地图上的隐藏标记进入
		   （hiddenRouteOpen() 为真时地图上才会出现它）。 */
		document.getElementById('button-next').addEventListener('click', function () {
			window.location.href = 'menu.html';
		});
	</script>

	<script src="js/bgm.js?v=20260917-tutor1"></script>
	<script>
		/* 背景音乐：先尝试播放，被浏览器拦截则等页面首次点击（见 js/bgm.js?v=20260914-gameplay2） */
		initBgm('game-music');
	</script>
</body>
</html>
