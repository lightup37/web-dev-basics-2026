<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tang &amp; Song Poems</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
	<link rel="stylesheet" href="./css/theme.css">
	<link rel="stylesheet" href="./css/layout.css">
</head>
<body>
	<main class="container">
		<header class="site-header">
			<div class="grid" style="align-items: center; justify-content: space-between; margin: 0;">
				<h1 id="site-title" style="margin: 0;"></h1>
				<select id="lang-switcher" style="width: auto; margin: 0;">
					<option value="en">English</option>
					<option value="zh">中文</option>
				</select>
			</div>
		</header>

		<section class="search-section" aria-label="Search">
			<div class="search-bar">
				<div class="search-input-wrap">
					<input type="search" id="search-input" style="margin: 0;">
					<button id="filter-toggle" type="button" class="filter-toggle" style="margin: 0;"></button>
				</div>
				<button id="search-btn" type="button" style="margin: 0;"></button>
			</div>
			<div id="filter-panel" class="filter-panel" hidden>
				<div class="filter-menu">
					<div class="filter-item">
						<label for="filter-author" id="filter-author-label" class="filter-label"></label>
						<input type="text" id="filter-author" style="width: auto; margin: 0;">
					</div>
					<div class="filter-item">
						<label for="filter-title" id="filter-title-label" class="filter-label"></label>
						<input type="text" id="filter-title" style="width: auto; margin: 0;">
					</div>
					<div class="filter-item">
						<label id="filter-dynasty-label" class="filter-label"></label>
						<div class="filter-chips">
							<button id="filter-dynasty-tang" type="button" class="filter-chip secondary" style="width: auto; margin: 0;"></button>
							<button id="filter-dynasty-song" type="button" class="filter-chip secondary" style="width: auto; margin: 0;"></button>
						</div>
					</div>
				</div>
			</div>
		</section>

		<section id="modules" aria-label="Daily features">
			<div id="daily-grid" class="grid">
				<article>
					<header><h2 id="daily-poem-title" style="margin: 0;"></h2></header>
					<p id="daily-poem-content" class="poem-content"></p>
					<footer id="daily-poem-meta" class="muted"></footer>
				</article>
				<article>
					<header><h2 id="daily-poet-title" style="margin: 0;"></h2></header>
					<p id="daily-poet-name"></p>
					<p id="daily-poet-works" class="muted"></p>
				</article>
			</div>
		</section>

		<section id="results" hidden aria-label="Search results">
			<h2 id="results-heading"></h2>
			<p id="results-count" class="muted"></p>
			<div id="results-list"></div>
		</section>

		<div id="random-area" class="random-area">
			<button id="random-btn" style="margin: 0;"></button>
		</div>
	</main>

	<footer class="site-footer">
		<p style="margin: 0;">
			<a href="../" id="back-link"></a>
			<span> · </span>
			<span id="footer-text"></span>
		</p>
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js"></script>
	<script src="./js/data.js"></script>
	<script src="./js/lang.js"></script>
	<script src="./js/search.js"></script>
	<script src="./js/main.js"></script>
</body>
</html>
